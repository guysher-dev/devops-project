name: Merge

on:
  push:
    branches: [main]

jobs:
  image-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/devops-project:${{ github.sha }} .
      - run: docker push ${{ vars.DOCKERHUB_USERNAME }}/devops-project:${{ github.sha }}

  deploy:
    needs: image-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy - Task 6 deploys the image here"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: echo "smoke-test - Task 6 calls the deployed app here"
